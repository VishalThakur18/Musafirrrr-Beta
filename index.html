<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Musafirrrr — All group trips. One place.</title>
<meta name="description" content="Discover upcoming group trips from trusted travel communities and organizers across India. Search by destination, dates and budget, then connect directly with the organizer." />

<style>
#boot-loader { position:fixed; inset:0; z-index:99999; display:grid; place-content:center; justify-items:center; gap:16px; background:#f5f5f5; color:#132025; opacity:1; transition:opacity .65s cubic-bezier(.22,1,.36,1); }
#boot-loader.is-leaving { opacity:0; }
#boot-loader[hidden] { display:none; }
#boot-loader img { width:clamp(220px, 50vw, 360px); height:clamp(220px, 50vw, 360px); object-fit:contain; }
#boot-loader strong { font-family:"Caveat",cursive; font-size:48px; font-weight:700; }
#boot-loader p, #boot-loader button { font:14px system-ui,sans-serif; }
#boot-loader button { padding:12px 24px; border:1px solid #e5ded5; border-radius:24px; background:white; cursor:pointer; }
html { scrollbar-gutter:stable; }
body.is-booting { overflow:hidden; }
body.is-booting #root { opacity:0; }
body.is-booting.is-revealing #root { opacity:1; }
@media(prefers-reduced-motion:reduce) { #root, #boot-loader { transition:none; } }
</style>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
(function () {
  function preload(as, href, priority) {
    var link = document.createElement('link');
    link.rel = 'preload'; link.as = as; link.href = href;
    if (priority) link.fetchPriority = priority;
    document.head.appendChild(link);
  }
  // Start the home hero poster download before React renders it (home route only).
  if ((location.hash.slice(1).split('?')[0] || '/') === '/') preload('image', 'assets/videos/home-hero-poster.webp', 'high');

  // Local development loads the source files listed at the end of <body>; everywhere else loads
  // the bundle built by `npm run build:js` (which also updates the ?v= hash below).
  // ?source or ?bundle in the URL forces either mode.
  var query = location.search;
  var local = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var useSource = /[?&]source(=|&|$)/.test(query) || (local && !/[?&]bundle(=|&|$)/.test(query));
  window.APP_BUNDLE = useSource ? null : 'assets/js/app.min.js?v=799439d180';
  if (window.APP_BUNDLE) preload('script', window.APP_BUNDLE);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="src/assets/logo.jpeg">
<link rel="preconnect" href="https://ovcjebdtehnobbcsmync.supabase.co" crossorigin>

<!-- Global styles -->
<link rel="stylesheet" href="src/features/compare/compare.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="src/features/organizerDashboard/styles/organizerDashboard.css?v=20261027-analytics-button-1">
<link rel="stylesheet" href="src/features/organizerDashboard/styles/finance.css">

<!-- Tailwind, prebuilt from src/config/tailwind.config.js. Rebuild with `npm run build:css`
     after adding new Tailwind classes. Kept last so it overrides like the old CDN did. -->
<link rel="stylesheet" href="assets/css/tailwind.css">

</head>
<body class="is-booting">
<div id="boot-loader" role="status" aria-live="polite">
<img src="assets/videos/loder.svg" alt="" onerror="this.hidden=true">
<strong>Musafiirrrr</strong>
<p id="boot-message">Getting your next adventure ready?</p>
<button id="boot-retry" type="button" hidden onclick="location.reload()">Try again</button>
</div>
<script src="src/core/startup.js"></script>
<!-- React mounts here -->
<div id="root" inert aria-busy="true"></div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  APPLICATION SCRIPTS — ORDER MATTERS (each file uses things defined above it).
  1 config -> 2 utils/assets -> 3 data -> 4 backend -> 5 middleware
  -> 6 UI components -> 7 pages -> 8 App -> 9 main (starts the app)

  Local development (localhost, 127.0.0.1, file://) loads these source files one by one,
  so edits show up on refresh. Everywhere else loads assets/js/app.min.js, a minified bundle
  of the same files in the same order (the choice is made in <head>). After changing any file
  below (or this list), run `npm run build:js` before deploying.
-->
<script>
(function () {
  var files = [ // app-scripts:start
    // 1. CONFIG
    'src/config/constants.js',
    'src/config/destination-images.js',
    'src/config/image-variants.js',
    'src/config/supabase.js',

    // 1b. REACT GLOBALS
    'src/core/react-globals.js',

    // 2. UTILITIES
    'src/utils/helpers.js',
    'src/utils/format.js',
    'src/utils/links.js',

    // 2b. ASSETS (images + icons)
    'src/assets/imagery.js',
    'src/assets/photo-tools.js',
    'src/assets/icons.js',

    // 3. SEED DATA
    'src/data/organizers.data.js',
    'src/data/trip.factory.js',
    'src/data/trips.data.js',
    'src/data/users.data.js',
    'src/data/enquiries.data.js',

    // 4. BACKEND (mock database + services)
    'src/backend/store.js',
    'src/backend/services/data.service.js',
    'src/backend/services/auth.service.js',
    'src/backend/services/trip.service.js',
    'src/backend/services/organizer.service.js',
    'src/backend/services/wishlist.service.js',
    'src/backend/services/finance.service.js',
    'src/backend/services/enquiry.service.js',
    'src/backend/services/review.service.js',
    'src/features/organizerDashboard/services/analytics.service.js',

    // 5. MIDDLEWARE (hooks, router, guard, toast)
    'src/middleware/store.hooks.js',
    'src/middleware/toast.js',
    'src/middleware/router.js',
    'src/middleware/auth.guard.js',
    'src/features/compare/compare.service.js',
    'src/features/compare/compare.state.js',

    // 6a. UI COMPONENTS
    'src/components/ui/Icon.js',
    'src/components/ui/Button.js',
    'src/components/ui/Form.js',
    'src/components/ui/Badges.js',
    'src/components/ui/Modal.js',
    'src/components/ui/Feedback.js',
    'src/components/ui/Layout.js',
    'src/components/ui/ScrollReveal.js',
    'src/components/ui/SiteMotion.js',

    // 6b. SHARED COMPONENTS
    'src/components/shared/TripCard.js',
    'src/components/shared/ContactButtons.js',
    'src/components/shared/SearchBar.js',
    'src/components/shared/PasswordCard.js',

    // 6c. LAYOUT COMPONENTS
    'src/components/layout/Logo.js',
    'src/components/layout/Navbar.js',
    'src/components/layout/MobileTabs.js',
    'src/components/layout/Footer.js',

    // 7a. PUBLIC PAGES
    'src/pages/public/HomePage.js',
    'src/pages/public/ExplorePage.js',
    'src/pages/public/TripDetailPage.js',
    'src/pages/public/OrganizerPage.js',
    'src/pages/public/HowItWorksPage.js',
    'src/pages/public/ForCommunitiesPage.js',
    'src/pages/public/CompanyPages.js',
    'src/pages/public/LegalPages.js',

    // 7b. AUTH PAGES
    'src/pages/auth/AuthShell.js',
    'src/pages/auth/LoginPage.js',
    'src/pages/auth/SignupPage.js',

    // 7c. TRAVELLER PAGES
    'src/pages/traveller/SavedPage.js',
    'src/pages/traveller/TravellerDashboard.js',
    'src/pages/traveller/TravellerMyTrips.js',
    'src/pages/traveller/TravellerProfile.js',
    'src/pages/traveller/ReviewsSection.js',

    // 7d. ORGANIZER Dashboard PAGES
    'src/features/organizerDashboard/services/liveUpdates.js',
    'src/features/organizerDashboard/components/OrganizerMotion.js',
    'src/features/organizerDashboard/components/OrganizerShell.js',
    'src/features/organizerDashboard/components/OrganizerAnalyticsCharts.js',
    'src/features/organizerDashboard/components/OrganizerTripPerformance.js',
    'src/features/organizerDashboard/pages/OrganizerDashboard.js',
    'src/features/organizerDashboard/pages/OrganizerLeads.js',
    'src/features/organizerDashboard/components/OrganizerTripSheet.js',
    'src/features/organizerDashboard/pages/OrganizerTrips.js',
    'src/features/organizerDashboard/pages/OrganizerDepartures.js',
    'src/features/organizerDashboard/finance/finance.model.js',
    'src/features/organizerDashboard/finance/FinancialEntryForm.js',
    'src/features/organizerDashboard/finance/FinanceBookings.js',
    'src/features/organizerDashboard/finance/FinanceMetricBreakdown.js',
    'src/features/organizerDashboard/finance/TravellerPayments.js',
    'src/features/organizerDashboard/pages/RevenueFinancePage.js',
    'src/features/organizerDashboard/pages/TripWizard.js',
    'src/features/organizerDashboard/pages/OrganizerProfileEdit.js',
    'src/features/organizerDashboard/pages/OrganizerSettings.js',
    'src/features/compare/CompareUI.js',

    // 8. ROOT APP
    'src/App.js',

    // 9. ENTRY POINT (must be last)
    'src/main.js'
  ]; // app-scripts:end
  // APP_BUNDLE is chosen in <head>: null means load the source files.
  (window.APP_BUNDLE ? [window.APP_BUNDLE] : files).forEach(function (src) {
    var script = document.createElement('script');
    script.src = src;
    script.async = false; // run in list order
    document.body.appendChild(script);
  });
})();
</script>
</body>
</html>
